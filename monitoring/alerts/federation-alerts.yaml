# SPIRE Federation Health Alerts
# These alerts monitor federation bundle fetching and trust domain connectivity
# to ensure cross-cluster/cross-domain authentication works correctly.

groups:
  - name: spire_federation_alerts
    interval: 60s
    rules:
      # Critical: Federation bundle fetch failures
      - alert: SPIREFederationBundleFetchFailing
        expr: rate(spire_server_bundle_manager_fetch_federated_bundle{status!="OK"}[10m]) > 0.5
        for: 15m
        labels:
          severity: critical
          component: spire-server
          category: federation
        annotations:
          summary: "Federation bundle fetch failing for trust domain"
          description: |
            Trust domain {{ $labels.trust_domain_id }} federation bundle fetch has {{ $value | humanize }} errors/s over 10 minutes.
            Cross-domain authentication will fail if bundle fetching continues to fail.
          runbook: "https://github.com/spiffe/spire/tree/main/doc"

      # Warning: Intermittent federation bundle fetch failures
      - alert: SPIREFederationBundleFetchDegraded
        expr: rate(spire_server_bundle_manager_fetch_federated_bundle{status!="OK"}[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
          component: spire-server
          category: federation
        annotations:
          summary: "Intermittent federation bundle fetch failures"
          description: |
            Trust domain {{ $labels.trust_domain_id }} federation bundle fetch has {{ $value | humanize }} errors/s.
            Network issues or remote endpoint problems may be affecting federation.
          runbook: "https://github.com/spiffe/spire/tree/main/doc"

      # Warning: No recent federation bundle updates
      - alert: SPIREFederationBundleNotUpdated
        expr: increase(spire_server_bundle_manager_update_federated_bundle[2h]) == 0
        for: 10m
        labels:
          severity: warning
          component: spire-server
          category: federation
        annotations:
          summary: "Federation bundle has not been updated recently"
          description: |
            Trust domain {{ $labels.trust_domain_id }} federation bundle has not been updated in the last 2 hours.
            Bundle refresh may be stalled. Check federation endpoint connectivity.
          runbook: "https://github.com/spiffe/spire/tree/main/doc"

      # Critical: Federation bundle extremely stale
      - alert: SPIREFederationBundleStale
        expr: increase(spire_server_bundle_manager_update_federated_bundle[24h]) == 0
        for: 30m
        labels:
          severity: critical
          component: spire-server
          category: federation
        annotations:
          summary: "Federation bundle is extremely stale (24+ hours)"
          description: |
            Trust domain {{ $labels.trust_domain_id }} federation bundle has not been updated in over 24 hours.
            This may cause authentication failures due to expired certificates in the bundle.
          runbook: "https://github.com/spiffe/spire/tree/main/doc"

      # Warning: Bundle fetch latency high
      - alert: SPIREFederationBundleFetchLatencyHigh
        expr: |
          histogram_quantile(0.95,
            rate(spire_server_bundle_manager_fetch_federated_bundle_elapsed_time_bucket[5m])
          ) > 5000
        for: 10m
        labels:
          severity: warning
          component: spire-server
          category: federation
        annotations:
          summary: "Federation bundle fetch latency is high"
          description: |
            Trust domain {{ $labels.trust_domain_id }} federation bundle fetch p95 latency is {{ $value | humanize }}ms.
            Network latency or remote endpoint performance issues detected.
          runbook: "https://github.com/spiffe/spire/tree/main/doc"

      # Info: New federation bundle configured
      - alert: SPIREFederationBundleUpdated
        expr: increase(spire_server_bundle_manager_update_federated_bundle[5m]) > 0
        for: 1m
        labels:
          severity: info
          component: spire-server
          category: federation
        annotations:
          summary: "Federation bundle successfully updated"
          description: |
            Trust domain {{ $labels.trust_domain_id }} federation bundle was successfully updated.
            This is informational - no action required.
          runbook: "https://github.com/spiffe/spire/tree/main/doc"

      # Warning: Datastore bundle operations failing
      - alert: SPIREDatastoreBundleOperationsFailing
        expr: rate(spire_server_datastore_bundle_fetch{status!="OK"}[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
          component: spire-server
          category: federation
        annotations:
          summary: "Datastore bundle fetch operations failing"
          description: |
            Datastore bundle fetch operations have {{ $value | humanize }} errors/s.
            Database connectivity or performance issues may affect federation.
          runbook: "https://github.com/spiffe/spire/tree/main/doc"

      # Critical: Bundle pruning failures
      - alert: SPIREBundlePruningFailing
        expr: rate(spire_server_datastore_bundle_prune{status!="OK"}[10m]) > 0.5
        for: 15m
        labels:
          severity: critical
          component: spire-server
          category: federation
        annotations:
          summary: "Bundle pruning operations failing"
          description: |
            Bundle pruning has {{ $value | humanize }} errors/s over 10 minutes.
            This may cause bundle bloat and performance degradation.
          runbook: "https://github.com/spiffe/spire/tree/main/doc"
