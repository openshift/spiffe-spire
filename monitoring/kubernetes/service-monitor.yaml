---
apiVersion: v1
kind: Service
metadata:
  name: spire-server-metrics
  namespace: spire
  labels:
    app: spire-server
    component: metrics
spec:
  type: ClusterIP
  selector:
    app: spire-server
  ports:
    - name: prometheus
      port: 9988
      targetPort: 9988
      protocol: TCP

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spire-server
  namespace: spire
  labels:
    app: spire-server
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: spire-server
      component: metrics
  endpoints:
    - port: prometheus
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
      scheme: http
  namespaceSelector:
    matchNames:
      - spire

---
apiVersion: v1
kind: Service
metadata:
  name: spire-agent-metrics
  namespace: spire
  labels:
    app: spire-agent
    component: metrics
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for DaemonSet
  selector:
    app: spire-agent
  ports:
    - name: prometheus
      port: 9989
      targetPort: 9989
      protocol: TCP

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spire-agent
  namespace: spire
  labels:
    app: spire-agent
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: spire-agent
      component: metrics
  endpoints:
    - port: prometheus
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
      scheme: http
  namespaceSelector:
    matchNames:
      - spire
